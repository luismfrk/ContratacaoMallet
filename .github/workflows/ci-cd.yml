name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Compilar módulos para validar sintaxe
        run: python -m compileall -q .

      - name: Executar testes unitários
        env:
          AI_PROVIDER: disabled
          DATABASE_URL: ""
          COOKIE_SECURE: "false"
        run: python -m unittest discover -s tests -v

  image:
    name: Build e publicação da imagem
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e rótulos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luismfrk/contratacaomallet
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Render
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Instalar Render CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/render-oss/cli/releases/download/v2.26.0/cli_2.26.0_linux_amd64.zip \
            --output render.zip
          unzip -q render.zip
          sudo install -m 0755 render /usr/local/bin/render 2>/dev/null || \
            sudo install -m 0755 cli_v2.26.0 /usr/local/bin/render

      - name: Publicar a nova imagem no serviço
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
          RENDER_CLI_DISABLE_ANALYTICS: "1"
          CI: "true"
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          test -n "$RENDER_WORKSPACE_ID"
          render workspace set "$RENDER_WORKSPACE_ID" --confirm
          render deploys create "$RENDER_SERVICE_ID" \
            --image ghcr.io/luismfrk/contratacaomallet:latest \
            --wait --output json --confirm
